<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>3 · Side panel</title>
<link rel="icon" href="fav/final.svg">
<link rel="stylesheet" href="shared.css">
<style>
  body { display: grid; grid-template-columns: 168px 1fr; background: #e4e7eb; }
  .panel { display: flex; flex-direction: column; gap: 6px; padding: 10px 8px; background: #fff; border-right: 1px solid var(--line); }
  .head { display: flex; align-items: center; gap: 8px; padding: 0 2px 4px; }
  .head img { width: 34px; height: 34px; }
  .name { font-size: 13px; font-weight: 700; line-height: 1.15; color: var(--ink); }
  .name b { color: var(--blue); font-weight: 800; }
  .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; justify-items: center; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .btn.tile { flex-direction: column; gap: 3px; min-height: 56px; min-width: 0; width: 100%; padding: 5px 0; font-size: 13px; line-height: 1.1; text-align: center; }
  .btn.tile { white-space: normal; }
  .g2 .btn { min-width: 0; padding: 0 6px; gap: 6px; font-size: 14px; }
  .sec { font-size: 13px; font-weight: 700; color: var(--muted); padding: 6px 4px 0; border-top: 1px solid var(--line); margin-top: 2px; }
  .btn.primary.full { width: 100%; justify-content: center; min-height: 52px; margin-top: 2px; }
  .stage { padding: 12px; }
  .frame { border-radius: 12px; padding: 7px; }
  .board { position: absolute; inset: 7px; border-radius: 6px; overflow: hidden; }
  .push { flex: 1; max-height: 40px; }
</style></head>
<body>
  <nav class="panel" aria-label="Tools">
    <div class="head"><img src="fav/final.svg" alt=""><div class="name">handwriting<br><b>repeater</b></div></div>
    <div class="g3">
      <button class="btn tile"><i data-i="undo"></i>Undo</button>
      <button class="btn tile" disabled><i data-i="redo"></i>Redo</button>
      <button class="btn tile"><i data-i="eraser"></i>Wipe</button>
    </div>
    <div class="g2">
      <button class="btn sel"><i data-i="marker"></i>Marker</button>
      <button class="btn"><i data-i="pencil"></i>Pencil</button>
    </div>
    <div class="g3">
      <span class="cw"><span class="swatch" style="--c:var(--black)"></span></span><span class="cw"><span class="swatch" style="--c:var(--blue)"></span></span><span class="cw"><span class="swatch on" style="--c:var(--red)"></span></span><span class="cw"><span class="swatch" style="--c:var(--green)"></span></span><span class="cw"><span class="swatch" style="--c:var(--purple)"></span></span><span class="cw"><span class="swatch" style="--c:var(--orange)"></span></span>
      <button class="btn icon" aria-label="Thin"><span class="dot" style="width:5px;height:5px"></span></button><button class="btn icon sel" aria-label="Medium"><span class="dot" style="width:10px;height:10px"></span></button><button class="btn icon" aria-label="Thick"><span class="dot" style="width:16px;height:16px"></span></button>
    </div>
    <div class="sec">Set up</div>
    <div class="g3">
      <button class="btn tile"><i data-i="type"></i>Guide</button>
      <button class="btn tile"><i data-i="lines"></i>Lines</button>
      <button class="btn tile"><i data-i="image"></i>Picture</button>
      <button class="btn tile"><span class="preview-chip" style="--c:#fcfdfd;width:20px;height:20px"></span>Board<br>colour</button>
      <button class="btn tile"><i data-i="timer"></i>Timer</button>
      <button class="btn tile"><i data-i="more"></i>More</button>
    </div>
    <span class="push"></span>
    <div class="sec">Replay</div>
    <div class="g3">
      <button class="btn tile tog on" title="Show a faint copy while replaying"><i data-i="trace"></i>Ghost</button>
      <button class="btn tile tog"><i data-i="loop"></i>Loop</button>
      <button class="btn tile boxed"><i data-i="download"></i>Save GIF</button>
    </div>
    <button class="btn boxed" style="justify-content:space-between;padding:0 12px"><span style="display:inline-flex;gap:8px;align-items:center"><i data-i="speed"></i>Speed</span><span>1× ▾</span></button>
    <button class="btn primary full"><i data-i="play"></i>Replay</button>
  </nav>
  <main class="stage">
    <div class="fit frame wb-frame">
      <div class="board wb-surface"></div>
      <div class="zoom" style="right:19px;bottom:19px"><button class="btn icon" aria-label="Zoom out"><i data-i="minus" data-s="18"></i></button>100%<button class="btn icon" aria-label="Zoom in"><i data-i="plus" data-s="18"></i></button><button class="btn icon" aria-label="Full screen"><i data-i="fullscreen" data-s="18"></i></button></div>
    </div>
  </main>
  <script src="icons.js"></script><script src="board.js"></script>
</body></html>
