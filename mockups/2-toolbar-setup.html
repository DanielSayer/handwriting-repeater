<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>2 · One toolbar, Set up open</title>
<link rel="icon" href="fav/final.svg">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Edu+QLD+Beginner&family=Edu+VIC+WA+NT+Beginner&display=block">
<style>
  body { display: grid; grid-template-rows: 62px 1fr; background: #e4e7eb; }
  .bar { display: flex; align-items: center; gap: 2px; padding: 0 10px; background: #fff; border-bottom: 1px solid var(--line); position: relative; z-index: 3; }
  .lock { display: flex; align-items: center; gap: 7px; margin-right: 6px; }
  .lock img { width: 32px; height: 32px; }
  .lock span { font-size: 13px; font-weight: 700; line-height: 1.1; color: var(--ink); }
  .lock b { color: var(--blue); font-weight: 800; }
  .gap { width: 8px; flex: none; }
  .grow { flex: 1; }
  .opts { gap: 6px; }
  .opts .on-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 6px; background: #e8effc; color: var(--blue); font-size: 13px; font-weight: 700; }
  .stage { padding: 12px; position: relative; }
  .frame { border-radius: 12px; padding: 7px; }
  .board { position: absolute; inset: 7px; border-radius: 6px; overflow: hidden; }
  .group { display: flex; align-items: center; gap: 2px; padding: 0 2px; }

  .setup { position: absolute; top: 6px; width: 640px; padding: 16px; border-radius: 16px; background: #fff; box-shadow: 0 14px 40px rgba(29,36,51,.24), 0 0 0 1px rgba(29,36,51,.06); z-index: 5; }
  .tabs { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: #f0f2f5; }
  .tabs .btn { flex: 1; font-size: 14px; }
  .tabs .btn.cur { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); color: var(--ink); }
  .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 14px; }
  .lab { display: block; margin: 0 0 6px; font-size: 14px; font-weight: 700; }
  .field { width: 100%; height: 64px; padding: 8px 12px; border: 1.5px solid #c3c9d1; border-radius: 10px; font: 24px 'Edu NSW ACT Foundation'; color: var(--ink); resize: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { min-height: 44px; padding: 0 14px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--line); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; }
  .font { position: relative; display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 12px; border-radius: 10px; box-shadow: inset 0 0 0 1.5px var(--line); margin-bottom: 6px; font-size: 14px; font-weight: 600; }
  .font em { font-style: normal; font-size: 26px; color: var(--ink); font-weight: 400; }
  .font.on { box-shadow: inset 0 0 0 2px var(--blue); background: #f3f7fe; }
  .check { position: absolute; right: -7px; top: -7px; width: 20px; height: 20px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; }
  .step { display: inline-flex; align-items: center; border: 1.5px solid #c3c9d1; border-radius: 10px; }
  .step b { min-width: 30px; text-align: center; }
  .foot { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .foot a { margin-left: auto; color: var(--muted); font-weight: 600; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; min-height: 44px; }
  .scrim { position: absolute; inset: 0; background: rgba(29,36,51,.06); z-index: 4; }
</style></head>
<body>
  <header class="bar">
    <span class="lock"><img src="fav/final.svg" alt=""><span>handwriting<br><b>repeater</b></span></span>
    <span class="vr"></span>
    <div class="group">
      <button class="btn icon" aria-label="Undo"><i data-i="undo"></i></button>
      <button class="btn icon" aria-label="Redo" disabled><i data-i="redo"></i></button>
    </div>
    <span class="gap"></span>
    <div class="group">
      <button class="btn icon sel" aria-label="Marker"><i data-i="marker"></i></button>
      <button class="btn icon" aria-label="Pencil"><i data-i="pencil"></i></button>
      <span class="cw"><span class="swatch" style="--c:var(--black)"></span></span><span class="cw"><span class="swatch" style="--c:var(--blue)"></span></span><span class="cw"><span class="swatch on" style="--c:var(--red)"></span></span><span class="cw"><span class="swatch" style="--c:var(--green)"></span></span><span class="cw"><span class="swatch" style="--c:var(--purple)"></span></span><span class="cw"><span class="swatch" style="--c:var(--orange)"></span></span>
      <button class="btn boxed" aria-label="Marker size: medium" title="Size" style="gap:6px;padding:0 8px"><span class="dot" style="width:10px;height:10px"></span><i data-i="chev" data-s="14"></i></button>
      <button class="btn"><i data-i="eraser"></i>Wipe</button>
    </div>
    <span class="gap"></span><span class="vr"></span><span class="gap"></span>
    <button class="btn boxed SETUP"><i data-i="sliders"></i>Set up<i data-i="chev" data-s="14"></i></button>
    <span class="grow"></span>
    <button class="btn boxed opts" title="Speed, Ghost, Loop">1×<span class="on-tag"><i data-i="trace" data-s="14"></i>Ghost</span><i data-i="chev" data-s="14"></i></button>
    <span class="gap" style="width:6px"></span>
    <button class="btn primary"><i data-i="play"></i>Replay</button>
    <span class="gap" style="width:6px"></span>
    <button class="btn"><i data-i="download"></i>GIF</button>
      </header>
  <main class="stage">
    <div class="fit frame wb-frame">
      <div class="board wb-surface"></div>
      <div class="zoom" style="right:19px;bottom:19px"><button class="btn icon" aria-label="Zoom out"><i data-i="minus" data-s="18"></i></button>100%<button class="btn icon" aria-label="Zoom in"><i data-i="plus" data-s="18"></i></button><button class="btn icon" aria-label="Full screen"><i data-i="fullscreen" data-s="18"></i></button></div>
    </div>
    <div class="scrim"></div>
    <section class="setup" id="setup" aria-label="Set up">
      <div class="tabs"><button class="btn cur"><i data-i="type" data-s="18"></i>Guide</button><button class="btn"><i data-i="lines" data-s="18"></i>Lines</button><button class="btn"><span class="preview-chip" style="--c:#fcfdfd"></span>Board colour</button><button class="btn"><i data-i="image" data-s="18"></i>Picture</button><button class="btn"><i data-i="timer" data-s="18"></i>Timer</button></div>
      <div class="cols2">
        <div>
          <span class="lab">Words to copy</span>
          <textarea class="field">abcdefg</textarea>
          <div class="chips"><span class="chip">Alphabet</span><span class="chip">Numbers</span><span class="chip">Sentence</span></div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px"><span class="lab" style="margin:0">Repeat</span><span class="step"><button class="btn icon" aria-label="Fewer"><i data-i="minus" data-s="18"></i></button><b>3</b><button class="btn icon" aria-label="More"><i data-i="plus" data-s="18"></i></button></span></div>
        </div>
        <div>
          <span class="lab">Handwriting style</span>
          <div class="font on"><span class="check"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>NSW/ACT Foundation<em style="font-family:'Edu NSW ACT Foundation'">agqt</em></div>
          <div class="font">QLD Beginners<em style="font-family:'Edu QLD Beginner'">agqt</em></div>
          <div class="font">VIC/WA/NT Beginner<em style="font-family:'Edu VIC WA NT Beginner'">agqt</em></div>
          <button class="btn" style="width:100%;color:var(--blue)">More styles (3)<i data-i="chev" data-s="14"></i></button>
        </div>
      </div>
      <div class="foot"><button class="btn boxed"><i data-i="move"></i>Move / resize on board</button><button class="btn" style="color:var(--red)">Remove guide</button><a><i data-i="feedback" data-s="18"></i>Feedback</a></div>
    </section>
    <script>window.addEventListener('load',()=>{const b=document.querySelector('.SETUP').getBoundingClientRect();const p=document.getElementById('setup');p.style.left=Math.max(12,Math.min(b.left-12,innerWidth-652))+'px';document.querySelector('.SETUP').style.background='#eef0f3';});</script>
  </main>
  <script src="icons.js"></script><script src="board.js"></script>
</body></html>
